name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: nesbahdev
  SERVICE: nesbah-portal
  REGION: europe-west1
  IMAGE: gcr.io/nesbahdev/nesbah-portal

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --add-cloudsql-instances=nesbahdev:me-central2:production \
            --set-env-vars "^|^NODE_ENV=production|PGHOST=${{ secrets.PGHOST }}|PGPORT=${{ secrets.PGPORT }}|PGDATABASE=${{ secrets.PGDATABASE }}|PGUSER=${{ secrets.PGUSER }}|PGPASSWORD=${{ secrets.PGPASSWORD }}|JWT_SECRET=${{ secrets.JWT_SECRET }}|JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}|JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}|WATHIQ_API_KEY=${{ secrets.WATHIQ_API_KEY }}|WATHIQ_API_SECRET=${{ secrets.WATHIQ_API_SECRET }}|GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}|GCLOUD_PROJECT_ID=${{ secrets.GCLOUD_PROJECT_ID }}|EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}|EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}|EMAILJS_PRIVATE_KEY=${{ secrets.EMAILJS_PRIVATE_KEY }}|EMAILJS_NEWSLETTER_SUBSCRIPTION_TEMPLATE_ID=${{ secrets.EMAILJS_NEWSLETTER_SUBSCRIPTION_TEMPLATE_ID }}|EMAILJS_SUBMISSION_TEMPLATE_ID=${{ secrets.EMAILJS_SUBMISSION_TEMPLATE_ID }}|DISABLE_EMAIL_NOTIFICATIONS=${{ secrets.DISABLE_EMAIL_NOTIFICATIONS }}" \
            --quiet
