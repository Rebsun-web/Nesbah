name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: nesbahdev
  SERVICE: nesbah-portal
  REGION: europe-west1  
  IMAGE: gcr.io/nesbahdev/nesbah-portal
  CLOUDSQL_INSTANCE: nesbahdev:europe-west1:production-eu

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Generate Cloud Run service YAML
        env:
          IMAGE_SHA: ${{ env.IMAGE }}:${{ github.sha }}
          CLOUDSQL_INSTANCE: ${{ env.CLOUDSQL_INSTANCE }}
          S_PGHOST: ${{ secrets.PGHOST }}
          S_PGPORT: ${{ secrets.PGPORT }}
          S_PGDATABASE: ${{ secrets.PGDATABASE }}
          S_PGUSER: ${{ secrets.PGUSER }}
          S_PGPASSWORD: ${{ secrets.PGPASSWORD }}
          S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S_JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          S_JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          S_WATHIQ_API_KEY: ${{ secrets.WATHIQ_API_KEY }}
          S_WATHIQ_API_SECRET: ${{ secrets.WATHIQ_API_SECRET }}
          S_GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          S_GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
          S_EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          S_EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          S_EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          S_EMAILJS_NEWSLETTER_TEMPLATE_ID: ${{ secrets.EMAILJS_NEWSLETTER_SUBSCRIPTION_TEMPLATE_ID }}
          S_EMAILJS_SUBMISSION_TEMPLATE_ID: ${{ secrets.EMAILJS_SUBMISSION_TEMPLATE_ID }}
          S_EMAILJS_BANK_NEW_LEAD_TEMPLATE_ID: ${{ secrets.EMAILJS_BANK_NEW_LEAD_TEMPLATE_ID }}
          S_ADMIN_NOTIFICATION_EMAIL: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          S_DISABLE_EMAIL_NOTIFICATIONS: ${{ secrets.DISABLE_EMAIL_NOTIFICATIONS }}
        run: python3 .github/scripts/generate-service-yaml.py

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace /tmp/cloudrun-service.yaml \
            --region $REGION \
            --project $PROJECT_ID \
            --quiet
